
name: Build LAAR LIBRARY VST3

on:
  workflow_dispatch:
  push:
    paths:
      - "LAAR_LIBRARY_Windows_Build_Kit.zip"
      - ".github/workflows/blank.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract plugin source
        shell: pwsh
        run: |
          Expand-Archive -Path "LAAR_LIBRARY_Windows_Build_Kit.zip" -DestinationPath "package" -Force

      - name: Configure plugin
        run: cmake -S package -B package/build -A x64

      - name: Compile VST3
        run: cmake --build package/build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: LAAR-LIBRARY-VST3
          path: package/build/LaarLibrary_artefacts/Release/VST3/
          if-no-files-found: error
